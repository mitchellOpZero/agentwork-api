name: Integration bug
description: Report a routing request, result, MCP, or legacy API failure.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Don't include credentials, wallet secrets, payment proofs, personal data, or private URLs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Blocked-outcome submission
        - Private result retrieval
        - Outcome reporting
        - Remote MCP lifecycle
        - Agent discovery files
        - Legacy catalog or x402 API
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route
      placeholder: /v1/routing-requests
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: HTTP status
      placeholder: "400"
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include a redacted response excerpt when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent or client runtime
      placeholder: Codex, Node 22, Python requests, curl
